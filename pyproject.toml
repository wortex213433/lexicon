[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicon"
version = "0.1.0"
description = "Lexicon: Linux ve Termux için modüler, terminal tabanlı sistem monitörü"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lexicon = "lexicon.cli:main"

[tool.setuptools.packages.find]
include = ["lexicon*"]
